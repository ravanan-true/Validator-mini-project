<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial</title>
    <style>
         body{
            font-family: Comic Sans MS;
            background:url("123456.jpg");
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
        }
        h1{
            margin-top: 200px;
            text-align: center;
            color: white;
        }
        .a2d{
            margin-top: 100px;
            margin-left: 600px;
            display: grid;
        }
        input{
            font-family: Comic Sans MS;
            font-weight: bold;
            width: 300px;
            height: 50px;
            border: 2px solid black;
            border-radius: 12px;
            text-align: center;
        }
        button{
            font-family: Comic Sans MS;
            width: 309px;
            height: 54px;
            border: 2px solid black;
            border-radius: 12px;
            margin-top: 20px;
            margin-bottom: 20px;
            font-size: large;
            font-weight: bold;
        }
        a{
            text-decoration: none;
        }
        .a2c{
            color: rgb(225, 38, 38);
            margin-top: 75px;
            margin-left: 1280px;
            width: 180px;
            height: 35px;
            background-color: aqua; 
            font-size: large;
            font-weight: bold;
            border: 2px solid black;
            border-radius: 12px;
            text-align: center;
            padding-top:10px ;
        }
        .a2c:hover{
            transform: scale(1.09);
            border: 2px solid black ;
            color: rgb(191, 34, 230);
        }
    </style>
</head>
<body>
    <h1>Factorial</h1>
    <div class="a2d">
        <input type="text" id="num" placeholder="Enter the Number">
        <button onclick="checknum()">
            Check
        </button>
        <input type="text" id="answer" placeholder="Answer....." readonly>
    </div>
    <a href="Index.html"><div class="a2c">Return Home</div></a>

    <script>

        function checknum(){

            let dig = document.getElementById("num").value;

            let answer = document.getElementById("answer");

            if(dig.trim()==""){
                answer.value = "Enter a number";
            }
            else if(isNaN(dig)){
                answer.value = "Enter a number only";
            }
            else if(dig>0){

                let f = 1;

                for(let fac = dig ; fac > 0 ; fac--){
                    f = f * fac;
                }
                answer.value = dig + "! = " + f;
            }
            else{
                answer.value = dig + " is Not Allowed.";
            }

        }
    </script>
</body>
</html>
